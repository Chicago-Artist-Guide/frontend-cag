AWSTemplateFormatVersion: '2010-09-09'
Description: Main-only CI entry point that provisions CAG delivery roles, CDK toolkits and certificates
Parameters:
  WorkloadRegion:
    Type: String
    Default: us-east-1
Resources:
  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CagGithubBootstrapRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:Chicago-Artist-Guide/frontend-cag:environment:production-bootstrap
      Policies:
        - PolicyName: ProvisionDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${WorkloadRegion}:${AWS::AccountId}:stack/CagGithubCanaryDelivery/*
                  # The July bootstrap left the canary stack in us-east-2; move-canary-iam.sh retires it.
                  - !Sub arn:${AWS::Partition}:cloudformation:us-east-2:${AWS::AccountId}:stack/CagGithubCanaryDelivery/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${WorkloadRegion}:${AWS::AccountId}:stack/CagGithubProductionDelivery/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${WorkloadRegion}:${AWS::AccountId}:stack/CDKToolkit-cagprod/*
              - Effect: Allow
                Action: cloudformation:UpdateTerminationProtection
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${WorkloadRegion}:${AWS::AccountId}:stack/CDKToolkit-cagprod/*
              - Effect: Allow
                Action:
                  - cloudformation:Describe*
                  - cloudformation:GetTemplate*
                  - cloudformation:List*
                  - cloudformation:ValidateTemplate
                  - sts:GetCallerIdentity
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:ListAttachedRolePolicies
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:PutRolePermissionsBoundary
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubCanaryPlanRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubCanaryDeployRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubCanaryDestroyRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubProductionPlanRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubProductionDeployRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-cagprod-*-role-${AWS::AccountId}-${WorkloadRegion}
              - Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubCanaryPlanRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubCanaryDeployRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubCanaryDestroyRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubProductionPlanRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagGithubProductionDeployRole
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-cagprod-cfn-exec-role-${AWS::AccountId}-${WorkloadRegion}
                Condition:
                  ArnLike:
                    iam:PolicyARN:
                      - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/CagCanary*
                      - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/CagProduction*
              # The pinned toolkit attaches these AWS policies to these two roles only.
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-cagprod-lookup-role-${AWS::AccountId}-${WorkloadRegion}
                Condition:
                  ArnLike:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-cagprod-deploy-role-${AWS::AccountId}-${WorkloadRegion}
                Condition:
                  ArnLike:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/AWSCloudFormationReadOnlyAccess
              - Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:ListEntitiesForPolicy
                  - iam:ListPolicyTags
                  - iam:SetDefaultPolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/CagCanary*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/CagProduction*
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cdk-cagprod-assets-${AWS::AccountId}-${WorkloadRegion}
                  - !Sub arn:${AWS::Partition}:s3:::cdk-cagprod-assets-${AWS::AccountId}-${WorkloadRegion}/*
              - Effect: Allow
                Action: ecr:*
                Resource: !Sub arn:${AWS::Partition}:ecr:${WorkloadRegion}:${AWS::AccountId}:repository/cdk-cagprod-container-assets-${AWS::AccountId}-${WorkloadRegion}
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                  - ssm:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:ssm:${WorkloadRegion}:${AWS::AccountId}:parameter/cdk-bootstrap/cagprod/version
              - Effect: Allow
                Action: acm:ListCertificates
                Resource: '*'
              - Effect: Allow
                Action: acm:RequestCertificate
                Resource: '*'
                Condition:
                  ForAllValues:StringEquals:
                    acm:DomainNames:
                      - www.chicagoartistguide.org
                  StringEquals:
                    acm:ValidationMethod: DNS
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${WorkloadRegion}:${AWS::AccountId}:certificate/*
Outputs:
  BootstrapRoleArn:
    Value: !GetAtt BootstrapRole.Arn
