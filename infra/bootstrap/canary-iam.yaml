AWSTemplateFormatVersion: '2010-09-09'
Description: Scoped GitHub OIDC and CDK execution roles for the CAG canary

Parameters:
  GitHubOrganization:
    Type: String
    Default: Chicago-Artist-Guide
  GitHubRepository:
    Type: String
    Default: frontend-cag
  BootstrapQualifier:
    Type: String
    Default: cagcanary

Resources:
  CanaryCloudFormationExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: CagCanaryCloudFormationExecution
      Description: Actions needed by CloudFormation to manage CagPlatform-canary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Ec2Networking
            Effect: Allow
            Resource: '*'
            Action:
              - ec2:AssociateRouteTable
              - ec2:AttachInternetGateway
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateInternetGateway
              - ec2:CreateRoute
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
              - ec2:CreateTags
              - ec2:CreateVpc
              - ec2:DeleteInternetGateway
              - ec2:DeleteRoute
              - ec2:DeleteRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteTags
              - ec2:DeleteVpc
              - ec2:Describe*
              - ec2:DetachInternetGateway
              - ec2:DisassociateRouteTable
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
          - Sid: EcsCanary
            Effect: Allow
            Resource: '*'
            Action:
              - ecs:CreateCluster
              - ecs:CreateService
              - ecs:DeleteCluster
              - ecs:DeleteService
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:DescribeTaskDefinition
              - ecs:ListClusters
              - ecs:ListServices
              - ecs:ListTagsForResource
              - ecs:ListTaskDefinitions
              - ecs:RegisterTaskDefinition
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:UpdateService
          - Sid: LoadBalancing
            Effect: Allow
            Resource: '*'
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DeleteRule
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:Describe*
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:RemoveTags
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
          - Sid: CanaryLogs
            Effect: Allow
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cag/canary/*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cag/canary*
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
          - Sid: CanaryScaling
            Effect: Allow
            Resource: '*'
            Action:
              - application-autoscaling:DeleteScalingPolicy
              - application-autoscaling:DeregisterScalableTarget
              - application-autoscaling:DescribeScalingActivities
              - application-autoscaling:DescribeScalingPolicies
              - application-autoscaling:DescribeScalableTargets
              - application-autoscaling:PutScalingPolicy
              - application-autoscaling:RegisterScalableTarget
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:PutMetricAlarm
          - Sid: CanaryTaskRoles
            Effect: Allow
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CagPlatform-canary-*
            Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
          - Sid: RequiredServiceLinkedRoles
            Effect: Allow
            Resource: '*'
            Action: iam:CreateServiceLinkedRole
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - ecs.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - ecs.application-autoscaling.amazonaws.com

  CanaryPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CagGithubCanaryPlanRole
      Description: Read-only CDK diff role for the CAG canary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:canary-plan
      Policies:
        - PolicyName: ReadCanaryState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Resource: '*'
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - ec2:Describe*
                  - elasticloadbalancing:Describe*
                  - ecs:Describe*
                  - ecs:List*
                  - iam:GetRole
                  - logs:DescribeLogGroups
                  - ssm:GetParameter

  CanaryDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CagGithubCanaryDeployRole
      Description: CDK asset publishing and deployment entry role for canary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:canary
      Policies:
        - PolicyName: UseDedicatedCdkBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-deploy-role-${AWS::AccountId}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-file-publishing-role-${AWS::AccountId}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-image-publishing-role-${AWS::AccountId}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-lookup-role-${AWS::AccountId}-*
              - Effect: Allow
                Resource: '*'
                Action:
                  - cloudformation:DescribeStacks
                  - ssm:GetParameter

  CanaryDestroyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CagGithubCanaryDestroyRole
      Description: Manual destruction entry role for CagPlatform-canary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:canary-destroy
      Policies:
        - PolicyName: UseDedicatedCdkBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-deploy-role-${AWS::AccountId}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${BootstrapQualifier}-lookup-role-${AWS::AccountId}-*
              - Effect: Allow
                Resource: '*'
                Action:
                  - cloudformation:DescribeStacks
                  - ssm:GetParameter

Outputs:
  CanaryExecutionPolicyArn:
    Value: !Ref CanaryCloudFormationExecutionPolicy
  CanaryPlanRoleArn:
    Value: !GetAtt CanaryPlanRole.Arn
  CanaryDeployRoleArn:
    Value: !GetAtt CanaryDeployRole.Arn
  CanaryDestroyRoleArn:
    Value: !GetAtt CanaryDestroyRole.Arn
