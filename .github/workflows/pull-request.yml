name: Pull request checks

on:
  pull_request:
    branches:
      - master
      - staging

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: pull-request-${{ github.event.pull_request.number }}

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-firebase-api-key
  NEXT_PUBLIC_FIREBASE_APP_ID: ci-firebase-app-id
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ci-firebase-measurement-id
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-firebase-project-id
  NEXT_PUBLIC_FIREBASE_SENDER_ID: ci-firebase-sender-id
  NEXT_PUBLIC_LGL_API_KEY: ci-lgl-api-key

jobs:
  application:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check lint baseline
        run: npm run lint:check

      - name: Run application tests
        run: npm test

      - name: Build standalone application
        run: npm run build

      - name: Assemble standalone application
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public

      - name: Smoke standalone application
        env:
          BASE_URL: http://127.0.0.1:3000
          HOSTNAME: 127.0.0.1
          PORT: 3000
        run: |
          log_file="$RUNNER_TEMP/next-server.log"
          node .next/standalone/server.js > "$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cat "$log_file"
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          npm run smoke:server

  infrastructure:
    name: Verify CDK infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: infra/package-lock.json
          node-version-file: .nvmrc

      - name: Install infrastructure dependencies
        run: npm --prefix infra ci

      - name: Build, test, and synthesize CDK
        run: npm --prefix infra run verify

  visual-regression-checks:
    name: Verify visual-regression harness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint visual-regression scripts
        run: npm run vr:lint

      - name: Typecheck visual-regression scripts
        run: npm run vr:typecheck

      - name: Run visual-regression unit tests
        run: npm run vr:unit

  e2e:
    name: Verify E2E specs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-firebase-api-key
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-firebase-app-id
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ci-firebase-measurement-id
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-firebase-project-id
      NEXT_PUBLIC_FIREBASE_SENDER_ID: ci-firebase-sender-id
      NEXT_PUBLIC_LGL_API_KEY: ci-lgl-api-key

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E specs
        run: npm run test:e2e

  container:
    name: Verify production container
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Build linux/amd64 production image
        run: |
          docker buildx build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_SENDER_ID="$NEXT_PUBLIC_FIREBASE_SENDER_ID" \
            --build-arg NEXT_PUBLIC_LGL_API_KEY="$NEXT_PUBLIC_LGL_API_KEY" \
            --load \
            --platform linux/amd64 \
            --tag cag-frontend:pr \
            --target runner \
            .

      - name: Run and smoke production image
        run: |
          image_metadata="$(docker image inspect cag-frontend:pr --format '{{.Architecture}} {{.Config.User}}')"
          test "$image_metadata" = "amd64 1001:1001"

          container_name="cag-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run \
            --detach \
            --name "$container_name" \
            --publish 127.0.0.1::3000 \
            cag-frontend:pr

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          test "$(docker exec "$container_name" uname -m)" = "x86_64"
          published_address="$(docker port "$container_name" 3000/tcp)"
          published_port="${published_address##*:}"
          BASE_URL="http://127.0.0.1:${published_port}" npm run smoke:server
