name: Deploy Next.js canary

on:
  push:
    branches:
      - canary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: cag-canary

env:
  STACK_NAME: CagPlatform-canary

jobs:
  verify:
    name: Verify canary source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: validation-firebase-api-key
      NEXT_PUBLIC_FIREBASE_APP_ID: validation-firebase-app-id
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: validation-firebase-measurement-id
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: validation-firebase-project-id
      NEXT_PUBLIC_FIREBASE_SENDER_ID: validation-firebase-sender-id
      NEXT_PUBLIC_LGL_API_KEY: validation-lgl-api-key
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
          node-version-file: .nvmrc

      - name: Validate deployment target
        env:
          TARGET_REF: ${{ github.ref_name }}
          TARGET_REF_TYPE: ${{ github.ref_type }}
        run: |
          node scripts/deployment-target.mjs \
            --stage canary \
            --ref "$TARGET_REF" \
            --ref-type "$TARGET_REF_TYPE"

      - name: Install dependencies without AWS access
        run: |
          npm ci
          npm --prefix infra ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify application and infrastructure without AWS access
        run: npm run verify

  plan:
    name: Plan canary
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: canary-plan
    outputs:
      configuration_fingerprint: ${{ steps.configuration.outputs.configuration_fingerprint }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: infra/package-lock.json
          node-version-file: .nvmrc

      - name: Install infrastructure without lifecycle scripts
        run: npm --prefix infra ci --ignore-scripts

      - name: Fingerprint planned deployment configuration
        id: configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_SENDER_ID }}
          NEXT_PUBLIC_LGL_API_KEY: ${{ vars.NEXT_PUBLIC_LGL_API_KEY }}
        run: node scripts/deployment-config.mjs >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: cag-canary-plan-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Diff canary without a CloudFormation change set
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_SENDER_ID }}
          NEXT_PUBLIC_LGL_API_KEY: ${{ vars.NEXT_PUBLIC_LGL_API_KEY }}
        working-directory: infra
        run: |
          npm exec cdk -- diff "$STACK_NAME" \
            --context stage=canary \
            --no-change-set

  deploy:
    name: Deploy canary
    needs:
      - verify
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: canary
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: infra/package-lock.json
          node-version-file: .nvmrc

      - name: Install infrastructure without lifecycle scripts
        run: npm --prefix infra ci --ignore-scripts

      - name: Fingerprint deploy configuration
        id: configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_SENDER_ID }}
          NEXT_PUBLIC_LGL_API_KEY: ${{ vars.NEXT_PUBLIC_LGL_API_KEY }}
        run: node scripts/deployment-config.mjs >> "$GITHUB_OUTPUT"

      - name: Require the planned configuration
        env:
          DEPLOY_CONFIGURATION_FINGERPRINT: ${{ steps.configuration.outputs.configuration_fingerprint }}
          PLAN_CONFIGURATION_FINGERPRINT: ${{ needs.plan.outputs.configuration_fingerprint }}
        run: |
          if [ "$DEPLOY_CONFIGURATION_FINGERPRINT" != "$PLAN_CONFIGURATION_FINGERPRINT" ]; then
            echo "Deployment configuration differs from the approved plan." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: cag-canary-deploy-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Deploy exact canary stack
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_SENDER_ID }}
          NEXT_PUBLIC_LGL_API_KEY: ${{ vars.NEXT_PUBLIC_LGL_API_KEY }}
        working-directory: infra
        run: |
          npm exec cdk -- deploy "$STACK_NAME" \
            --context stage=canary \
            --outputs-file "$RUNNER_TEMP/cdk-outputs.json" \
            --require-approval never

      - name: Read validated load balancer output
        id: deployment
        run: |
          node scripts/read-cdk-output.mjs \
            --file "$RUNNER_TEMP/cdk-outputs.json" \
            --stack "$STACK_NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke deployed canary
        env:
          BASE_URL: ${{ steps.deployment.outputs.base_url }}
        run: npm run smoke:server

      - name: Publish canary URL
        env:
          BASE_URL: ${{ steps.deployment.outputs.base_url }}
        run: |
          {
            echo "## Next.js canary deployment complete"
            echo "Validated ALB URL: $BASE_URL"
            echo "Amplify staging and DNS were not changed."
          } >> "$GITHUB_STEP_SUMMARY"
