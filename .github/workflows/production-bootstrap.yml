name: Bootstrap Next.js delivery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-bootstrap.yml
      - infra/bootstrap/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: cag-production-bootstrap

jobs:
  bootstrap:
    name: Bootstrap production IAM and CDK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-bootstrap
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
      - name: Install infrastructure without lifecycle scripts
        run: npm --prefix infra ci --ignore-scripts
      - name: Configure dedicated bootstrap credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          disable-retry: true
          role-session-name: cag-production-bootstrap-${{ github.run_id }}
      - name: Move canary delivery IAM to the workload region
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash infra/bootstrap/move-canary-iam.sh
      - name: Restore canary delivery outputs and manage IAM from us-east-1
        run: |
          aws cloudformation deploy --region us-east-1 \
            --stack-name CagGithubCanaryDelivery \
            --template-file infra/bootstrap/canary-iam.yaml \
            --parameter-overrides WorkloadRegion=us-east-1 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
      - name: Verify canary IAM matches the desired template after deployment
        working-directory: infra
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: node --import tsx bootstrap/verify-canary-iam.ts bootstrap/canary-iam.yaml "$AWS_ACCOUNT_ID" "$AWS_REGION"
      - name: Provision dedicated production delivery roles
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash infra/bootstrap/bootstrap-production.sh
