name: Destroy Next.js canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter CagPlatform-canary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: cag-canary

jobs:
  validate:
    name: Validate canary destruction
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: infra/package-lock.json
          node-version-file: .nvmrc

      - name: Require exact stack confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "CagPlatform-canary"

      - name: Install dependencies without AWS access
        run: npm --prefix infra ci

      - name: Verify infrastructure without AWS access
        run: npm --prefix infra run verify

  destroy:
    name: Destroy canary
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: canary-destroy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: npm
          cache-dependency-path: infra/package-lock.json
          node-version-file: .nvmrc

      - name: Install infrastructure without lifecycle scripts
        run: npm --prefix infra ci --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: cag-canary-destroy-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Destroy exact canary stack
        working-directory: infra
        run: |
          npm exec cdk -- destroy CagPlatform-canary \
            --context stage=canary \
            --force
